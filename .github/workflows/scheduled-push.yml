name: Scheduled Auto Push to Staging and Main

on:
  schedule:
    # 01:00 AM WIB (UTC+7) on Dec 30 = 18:00 UTC on Dec 29
    # Format: minute hour day month day-of-week
    - cron: '0 18 29 12 *'
  # Allows manual trigger anytime from the GitHub Actions tab for testing
  workflow_dispatch:
    inputs:
      target_message:
        description: 'Commit message for scheduled update'
        required: false
        default: 'docs: scheduled release update'

permissions:
  contents: write

jobs:
  scheduled-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update staging branch
        run: |
          git checkout staging
          git pull origin staging
          
          # Example: Update README or other files
          echo -e "\n<!-- Scheduled Release: $(date -u) -->" >> README.md
          
          git add README.md
          git commit -m "${{ github.event.inputs.target_message || 'docs: scheduled release update for 30 Dec' }}" || echo "No changes to commit"
          git push origin staging

      - name: Merge staging into main
        run: |
          git checkout main
          git pull origin main
          git merge staging -m "Merge branch 'staging' into main (Scheduled Cloud Release)"
          git push origin main
